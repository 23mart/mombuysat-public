async function decrypt(pw){
  const bytes = Uint8Array.from(atob(CIPHERTEXT), c => c.charCodeAt(0));
  const salt = bytes.slice(0,16), nonce = bytes.slice(16,28), ct = bytes.slice(28);
  const passKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:600000, hash:'SHA-256' },
    passKey, { name:'AES-GCM', length:256 }, false, ['decrypt']
  );
  const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:nonce }, key, ct);
  // Gzip aç
  const stream = new Response(pt).body.pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new TextDecoder().decode(buf);
}
async function unlock(pw){
  try {
    const html = await decrypt(pw);
    sessionStorage.setItem('puf_pw', pw);
    document.open(); document.write(html); document.close();
  } catch(e){
    sessionStorage.removeItem('puf_pw');
    document.getElementById('err').textContent = 'Yanlış parola';
    document.getElementById('btn').disabled = false;
  }
}
async function attempt(){
  const pw = document.getElementById('pw').value;
  if(!pw) return;
  document.getElementById('btn').disabled = true;
  document.getElementById('err').textContent = 'Açılıyor...';
  await unlock(pw);
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') attempt(); });
const saved = sessionStorage.getItem('puf_pw');
if(saved) unlock(saved);
