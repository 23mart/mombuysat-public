<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar</title>
  <style>
    :root {
      --bg:#0b0b10; --surface:#111118; --s2:#18181f; --border:#1f1f2a;
      --text:#f5f5f7; --muted:#8b8b96; --dim:#5c5c68;
      --green:#22c55e; --green-bg:rgba(34,197,94,.15); --green-fg:#86efac;
      --red:#ef4444; --red-bg:rgba(239,68,68,.15); --red-fg:#fca5a5;
      --orange:#fb923c; --orange-bg:rgba(251,146,60,.15); --orange-fg:#fdba74;
      --blue:#60a5fa; --blue-fg:#93c5fd;
      --ac:#a855f7; --ac2:#7e22ce; --ac3:#d8b4fe;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; font-size:13px; line-height:1.5; min-height:100vh; }

    .header { position:sticky; top:0; z-index:50; background:var(--surface); border-bottom:1px solid var(--border); padding:10px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
    .logo { display:flex; align-items:center; gap:10px; font-weight:700; font-size:15px; }
    .logo-mark { width:30px; height:30px; background:linear-gradient(135deg,var(--ac),var(--ac2)); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:15px; }
    .header-right { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
    .upd { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); }
    .dot { width:7px; height:7px; background:var(--ac); border-radius:50%; animation:blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }

    .page { max-width:1400px; margin:0 auto; padding:20px 24px; }

    .toolbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
    .tabs { display:flex; gap:4px; flex-wrap:wrap; }
    .tab { font-size:12px; font-weight:600; padding:6px 12px; border-radius:6px; background:var(--surface); border:1px solid var(--border); color:var(--muted); cursor:pointer; user-select:none; transition:.12s; }
    .tab:hover { background:var(--s2); color:var(--text); }
    .tab.active { background:rgba(168,85,247,.15); border-color:rgba(168,85,247,.4); color:var(--ac3); }
    .tab .count { font-size:10px; padding:1px 5px; margin-left:4px; border-radius:3px; background:var(--s2); color:var(--muted); }
    .tab.active .count { background:rgba(168,85,247,.25); color:var(--ac3); }

    .divider { width:1px; height:22px; background:var(--border); }

    .fbtn { font-size:11px; font-weight:600; padding:5px 10px; border-radius:6px; background:var(--surface); border:1px solid var(--border); color:var(--muted); cursor:pointer; user-select:none; }
    .fbtn:hover { background:var(--s2); color:var(--text); }
    .fbtn.active { background:rgba(168,85,247,.15); border-color:rgba(168,85,247,.4); color:var(--ac3); }
    .fbtn.s1.active { background:var(--green-bg); border-color:rgba(34,197,94,.4); color:var(--green-fg); }
    .fbtn.new.active { background:rgba(250,204,21,.15); border-color:rgba(250,204,21,.45); color:#fde047; }
    .fgroup { display:flex; gap:4px; }

    .search { flex:1; min-width:120px; max-width:200px; }
    .search input { width:100%; background:var(--surface); border:1px solid var(--border); border-radius:6px; color:var(--text); padding:6px 10px; font-size:12px; outline:none; }
    .search input:focus { border-color:var(--ac); }

    .stats { display:flex; align-items:center; gap:10px; font-size:11px; color:var(--muted); margin-left:auto; }
    .stats b { color:var(--text); font-weight:700; }

    .section { background:var(--surface); border:1px solid var(--border); border-radius:10px; overflow:hidden; }

    .tbl-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; }
    thead th { padding:10px 14px; font-size:10px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--border); white-space:nowrap; cursor:pointer; user-select:none; text-align:right; background:var(--surface); position:sticky; top:0; }
    thead th:first-child { text-align:left; }
    thead th.active { color:var(--ac3); }
    thead th:hover { color:var(--text); }
    tbody tr { border-bottom:1px solid var(--border); transition:background .1s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--s2); }
    td { padding:10px 14px; white-space:nowrap; font-variant-numeric:tabular-nums; font-size:12.5px; text-align:right; }
    td:first-child { text-align:left; }

    .sym-cell { display:flex; align-items:center; gap:8px; }
    .sym-name { font-weight:700; font-size:13.5px; color:var(--text); letter-spacing:-.2px; }
    .sym-badge { font-size:9px; padding:2px 6px; border-radius:4px; font-weight:700; letter-spacing:.4px; }
    .b-s1 { background:var(--green-bg); color:var(--green-fg); border:1px solid rgba(34,197,94,.35); }
    .b-new { background:rgba(250,204,21,.18); color:#fde047; border:1px solid rgba(250,204,21,.45); }
    .b-ihlal { background:rgba(220,38,38,.18); color:#fca5a5; border:1px solid rgba(220,38,38,.5); }

    .price { color:var(--muted); font-size:11.5px; }
    .ret { font-weight:700; font-size:13px; }
    .ret-big { font-weight:800; font-size:14px; letter-spacing:-.2px; }
    .diff-cell { display:inline-flex; align-items:center; gap:6px; justify-content:flex-end; min-width:80px; }
    .diff-arrow { font-size:10px; opacity:.7; }
    .mom-cell { display:inline-flex; align-items:center; gap:5px; justify-content:flex-end; font-size:11px; color:var(--dim); }
    .mom-up { color:var(--green-fg); }
    .mom-dn { color:var(--red-fg); }

    .ath { font-size:11.5px; }
    .ath-near { color:var(--green-fg); font-weight:700; }
    .ath-mid { color:var(--muted); }
    .ath-far { color:var(--dim); }

    .pos { color:var(--green-fg); } .neg { color:var(--red-fg); } .neu { color:var(--muted); } .dimc { color:var(--dim); }

    .bar-wrap { position:relative; width:60px; height:5px; background:var(--s2); border-radius:3px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:6px; }
    .bar { position:absolute; top:0; bottom:0; }
    .bar.pos { background:var(--green); left:50%; }
    .bar.neg { background:var(--red); right:50%; }
    .bar-mid { position:absolute; top:0; bottom:0; left:50%; width:1px; background:var(--border); }

    .macd-chart { display:block; }

    .empty { display:flex; align-items:center; justify-content:center; gap:10px; padding:60px; color:var(--muted); font-size:12px; }
    .spinner { width:16px; height:16px; border:2px solid var(--border); border-top-color:var(--ac); border-radius:50%; animation:spin .7s linear infinite; }
    @keyframes spin { to{transform:rotate(360deg)} }

    .footer { text-align:center; color:var(--dim); font-size:10.5px; padding:20px; margin-top:20px; }

    @media(max-width:640px){
      .page { padding:14px; }
      .stats { width:100%; margin-left:0; }
    }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">
    <div class="logo-mark">💜</div>
    <span>Radar</span>
  </div>
  <div class="header-right">
    <button id="notif-btn" class="fbtn" style="font-size:11px; padding:5px 10px;" title="Yeni sinyaller için tarayıcı bildirimi (sekme açık olmalı)">🔕 Bildirim kapalı</button>
    <div class="upd"><div class="dot"></div><span id="upd-label">Yükleniyor</span></div>
  </div>
</header>

<main class="page">

  <div class="toolbar" style="margin-bottom:8px;">
    <div class="fgroup" data-g="mode" style="border:1px solid var(--border); border-radius:8px; padding:2px;">
      <button class="fbtn active" data-m="macd" style="font-size:12px; padding:6px 14px;">📊 MACD Toparlanma</button>
      <button class="fbtn" data-m="fractal" style="font-size:12px; padding:6px 14px;">🔓 Fraktal Kırılım</button>
    </div>
  </div>

  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <div class="divider"></div>
    <div class="fgroup" data-g="sig">
      <button class="fbtn active" data-f="all">Hepsi</button>
      <button class="fbtn s1" data-f="s1">↑ Toparlanan</button>
    </div>
    <div class="divider"></div>
    <button class="fbtn new" data-g="new" data-f="new" title="Bu barda ilk kez sinyal veren (streak = 1)">✨ Yalnız yeni</button>
    <div class="search"><input id="q" type="text" placeholder="Sembol ara…"></div>
    <div class="stats">
      <span>Intraday <b id="upd-intraday">—</b></span>
      <span>·</span>
      <span>Daily <b id="upd-daily">—</b></span>
      <span>·</span>
      <span><b id="filter-count">0</b> hisse</span>
    </div>
  </div>

  <div id="endex-macd-wrap" class="section" style="display:none;">
    <div style="background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:10px 14px; display:flex; align-items:center; gap:14px;">
      <div style="font-size:11px; color:var(--muted); font-weight:600; min-width:110px;">XU100 <span id="endex-tf-label" style="color:var(--ac3);"></span></div>
      <div id="endex-macd-chart" style="flex:1; display:flex; justify-content:center;"></div>
    </div>
  </div>

  <div class="section">
    <div class="tbl-wrap">
      <table>
        <thead id="thead"><tr id="thead-row"></tr></thead>
        <tbody id="tbody"><tr><td colspan="9"><div class="empty"><div class="spinner"></div>Yükleniyor</div></td></tr></tbody>
      </table>
    </div>
  </div>

</main>

<footer class="footer">Veriler ~10 dk gecikmeli · Yatırım tavsiyesi değildir</footer>

<script>
  const TABS = [
    { key:'1h',  label:'1 Saat',    src:'intraday' },
    { key:'2h',  label:'2 Saat',    src:'intraday' },
    { key:'3h',  label:'3 Saat',    src:'intraday' },
    { key:'4h',  label:'4 Saat',    src:'intraday' },
    { key:'1d',  label:'1 Gün',     src:'daily' },
    { key:'1wk', label:'1 Hafta',   src:'daily' },
    { key:'1mo', label:'1 Ay',      src:'daily' },
    { key:'3mo', label:'3 Ay',      src:'daily' },
    { key:'rel', label:'Endeks Üstü', src:'daily' },
  ];

  const fmtPrice = v => v==null ? '—' : (v >= 1000 ? v.toLocaleString('tr-TR',{maximumFractionDigits:0}) : v.toFixed(2));
  const pct = (v,d=2) => v==null ? '—' : (v>=0?'+':'')+v.toFixed(d)+'%';
  const cls = v => v==null?'neu':(v>0?'pos':v<0?'neg':'neu');

  function athCell(sym){
    const a = DATA?.ath_map?.[sym];
    if(!a || a.uzaklik == null) return '<span class="ath ath-far">—</span>';
    const u = a.uzaklik;
    const kls = u >= -3 ? 'ath-near' : u >= -15 ? 'ath' : u >= -35 ? 'ath-mid' : 'ath-far';
    const label = u >= -0.5 ? 'ZİRVE' : u.toFixed(1) + '%';
    return `<span class="ath ${kls}" title="52H zirve: ${a.ath}">${label}</span>`;
  }

  let DATA = null, activeTab = '1h', activeSignal = 'all', newOnly = false, query = '', activeMode = 'macd';
  let rows = [], sortKey = 'tf_getiri', sortDir = -1;

  function drawTabs(){
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = TABS.map(t => {
      let n = 0;
      if(DATA){
        if(t.key === 'rel') n = (DATA.rel_gucu_endeks_ustu || []).length;
        else {
          const src = activeMode === 'fractal' ? DATA.dilimler_fractal : DATA.dilimler;
          n = (src?.[t.key] || []).length;
        }
      }
      return `<div class="tab ${t.key===activeTab?'active':''}" data-k="${t.key}">${t.label}<span class="count">${n}</span></div>`;
    }).join('');
    tabs.querySelectorAll('.tab').forEach(el => el.onclick = () => {
      activeTab = el.dataset.k;
      sortKey = activeTab === 'rel' ? 'rel.gunluk.fark' : 'tf_getiri';
      sortDir = -1;
      drawTabs(); render();
    });
  }

  function currentRows(){
    if(!DATA) return [];
    if(activeTab === 'rel') return DATA.rel_gucu_endeks_ustu || [];
    const src = activeMode === 'fractal' ? (DATA.dilimler_fractal || {}) : (DATA.dilimler || {});
    return src[activeTab] || [];
  }

  function applyFilter(list){
    let out = list;
    if(activeTab !== 'rel'){
      if(activeMode === 'macd'){
        if(activeSignal === 's1') out = out.filter(r => r.sinyal_1);
        if(newOnly) out = out.filter(r => r.sinyal_1 && (r.hist_streak || 0) === 1);
      } else {
        if(newOnly) out = out.filter(r => r.fractal_yeni);
      }
    }
    if(query) out = out.filter(r => r.sembol.toLowerCase().includes(query));
    return out;
  }

  function renderHead(){
    const row = document.getElementById('thead-row');
    if(activeTab === 'rel'){
      row.innerHTML = `
        <th data-k="sembol" data-t="s">Sembol</th>
        <th data-k="close" data-t="n">Fiyat</th>
        <th data-k="rel.gunluk.sembol" data-t="n">1G Getiri</th>
        <th data-k="rel.gunluk.fark" data-t="n" class="active">1G Fark</th>
        <th data-k="rel.haftalik.sembol" data-t="n">1H Getiri</th>
        <th data-k="rel.haftalik.fark" data-t="n">1H Fark</th>
        <th data-k="rel.aylik.sembol" data-t="n">1A Getiri</th>
        <th data-k="rel.aylik.fark" data-t="n">1A Fark</th>
        <th data-k="ath_uzaklik" data-t="n" title="Fiyatın son 1 yıl (52 hafta) zirvesine uzaklığı">52H</th>
      `;
    } else if(activeMode === 'fractal'){
      row.innerHTML = `
        <th data-k="sembol" data-t="s">Sembol</th>
        <th data-k="skor" data-t="n" class="active" title="Kalite skoru: yaş 5-25 + kırılım 0.5-3% + yeni + 52H zirveye yakın + endeksten güçlü + EMA50 üstü. Yeşil ≥10, sarı ≥7, turuncu ≥5.">Skor</th>
        <th title="Son 30 bar fiyat + kırılan fraktal seviyesi">Fiyat/Fraktal</th>
        <th data-k="close" data-t="n">Fiyat</th>
        <th data-k="fractal_high" data-t="n" title="Kırılan fraktal seviyesi (üstünde direnç yok)">Fraktal</th>
        <th data-k="kirilim_pct" data-t="n" title="Fiyat fraktal seviyesinin ne kadar üstünde">Kırılım</th>
        <th data-k="breakout_streak" data-t="n" title="Fraktal seviyesinin üstünde kesintisiz kaç bar (yeşil çizgi süresi)">Süre</th>
        <th data-k="fractal_bars_ago" data-t="n" title="Fraktal kaç bar önce oluştu">Yaş</th>
        <th data-k="tf_getiri" data-t="n">Getiri</th>
        <th data-k="tf_fark" data-t="n">Fark</th>
        <th data-k="ath_uzaklik" data-t="n" title="Fiyatın son 1 yıl (52 hafta) zirvesine uzaklığı">52H</th>
      `;
    } else {
      row.innerHTML = `
        <th data-k="sembol" data-t="s">Sembol</th>
        <th title="Son 30 bar MACD/Signal/Histogram">MACD</th>
        <th data-k="close" data-t="n">Fiyat</th>
        <th data-k="tf_getiri" data-t="n" class="active">Getiri</th>
        <th data-k="tf_endeks" data-t="n">XU100</th>
        <th data-k="tf_fark" data-t="n">Fark</th>
        <th data-k="ema50_uzaklik" data-t="n">EMA50↑</th>
        <th data-k="ath_uzaklik" data-t="n" title="Fiyatın son 1 yıl (52 hafta) zirvesine uzaklığı">52H</th>
        <th data-k="hist_streak_signed" data-t="n" title="Histogram delta yönünün kaç bardır aynı kaldığı">Bar</th>
      `;
    }
    row.querySelectorAll('th').forEach(th => th.onclick = () => {
      const k = th.dataset.k;
      if(k === sortKey) sortDir *= -1;
      else { sortKey = k; sortDir = th.dataset.t === 's' ? 1 : -1; }
      draw();
    });
  }

  function getVal(r, k){
    if(k === 'hist_delta') return (r.macdh || 0) - (r.macdh_prev || 0);
    if(k === 'hist_streak_signed') return (r.hist_streak || 0) * (r.hist_streak_yon || 0);
    if(k === 'skor') return fractalScore(r);
    if(k === 'breakout_streak') return breakoutStreak(r);
    if(k === 'ath_uzaklik'){ const a = DATA?.ath_map?.[r.sembol]; return a ? a.uzaklik : null; }
    if(k.includes('.')){
      const parts = k.split('.');
      let v = r;
      for(const p of parts){ if(v==null) return null; v = v[p]; }
      return v;
    }
    return r[k];
  }

  function macdChartCell(r, W, H){
    const macd = r.macd_series || [], signal = r.signal_series || [], hist = r.hist_series || [];
    if(!macd.length || !signal.length || !hist.length) return '';
    W = W || 140; H = H || 36;
    const PAD = 2;
    const all = macd.concat(signal, hist, [0]);
    const mn = Math.min(...all), mx = Math.max(...all);
    const range = Math.max(mx - mn, 1e-9);
    const y = v => PAD + (mx - v)/range * (H - 2*PAD);
    const x = i => PAD + i/(macd.length - 1) * (W - 2*PAD);
    const zeroY = y(0);
    const barW = (W - 2*PAD) / macd.length * 0.7;
    const bars = hist.map((v,i) => {
      const bx = x(i) - barW/2;
      const by = v >= 0 ? y(v) : zeroY;
      const bh = Math.max(Math.abs(y(v) - zeroY), 0.5);
      const p = i > 0 ? hist[i-1] : v;
      const fill = v >= 0 ? (v >= p ? '#16a34a' : '#86efac') : (v <= p ? '#dc2626' : '#fca5a5');
      return `<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" fill="${fill}"/>`;
    }).join('');
    const macdPath = 'M ' + macd.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' L ');
    const sigPath  = 'M ' + signal.map((v,i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' L ');
    return `<svg class="macd-chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`
      + `<line x1="${PAD}" y1="${zeroY.toFixed(1)}" x2="${W-PAD}" y2="${zeroY.toFixed(1)}" stroke="#3a3a48" stroke-width="0.6" stroke-dasharray="2,2"/>`
      + bars
      + `<path d="${macdPath}" fill="none" stroke="#60a5fa" stroke-width="1.2"/>`
      + `<path d="${sigPath}" fill="none" stroke="#f59e0b" stroke-width="1.2"/>`
      + `</svg>`;
  }

  function fractalScore(r){
    let s = 0;
    const y = r.fractal_bars_ago || 0;
    if(y >= 5 && y <= 25) s += 3;
    else if(y >= 3 && y <= 40) s += 1.5;
    else s += 0.5;
    const k = r.kirilim_pct || 0;
    if(k >= 0.5 && k <= 3) s += 3;
    else if(k >= 0.2 && k <= 5) s += 1.5;
    else if(k > 5) s += 0.5;
    if(r.fractal_yeni) s += 2;
    // 52H zirveye yakinlik (uzaklik negatif, sifira yakin = zirve)
    const ath = DATA?.ath_map?.[r.sembol];
    if(ath){
      const u = ath.uzaklik;
      if(u >= -1)       s += 4;     // zirveye yapisik/zirvenin uzerinde
      else if(u >= -3)  s += 3;     // %3 mesafede
      else if(u >= -7)  s += 2;     // %7 mesafede
      else if(u >= -15) s += 1;     // %15 mesafede
      // else 0
    }
    const f = r.tf_fark || 0;
    if(f > 0) s += Math.min(f, 3) * 0.5;
    const g = r.tf_getiri || 0;
    if(g > 0) s += Math.min(g, 3) * 0.3;
    const e = r.ema50_uzaklik || 0;
    if(e > 0) s += Math.min(e, 5) * 0.2;
    return Math.round(s * 10) / 10;
  }

  function breakoutStreak(r){
    // Fraktal seviyesinin üstünde kesintisiz kaç bar (sondan geriye)
    const closes = r.close_series || [];
    const fh = r.fractal_high;
    if(!closes.length || fh == null) return 0;
    let n = 0;
    for(let i = closes.length - 1; i >= 0; i--){
      if(closes[i] > fh) n++;
      else break;
    }
    return n;
  }

  function scoreBadge(s){
    // Renk skalasi (max ~15.4 zirveye yakin ideal setup): 10+ yesil, 7+ sari, 5+ turuncu, <5 gri
    let color;
    if(s >= 10)     color = '#22c55e';
    else if(s >= 7) color = '#eab308';
    else if(s >= 5) color = '#f59e0b';
    else            color = '#8b8b9e';
    return `<span style="display:inline-block; padding:2px 8px; border-radius:10px; background:${color}22; color:${color}; border:1px solid ${color}55; font-weight:700; font-size:12px; font-variant-numeric:tabular-nums;">${s.toFixed(1)}</span>`;
  }

  function priceFractalChart(r, W, H){
    const closes = r.close_series || [];
    const fh = r.fractal_high;
    if(!closes.length || fh == null) return '';
    W = W || 140; H = H || 36;
    const PAD = 2;
    const all = closes.concat([fh]);
    const mn = Math.min(...all), mx = Math.max(...all);
    const range = Math.max(mx - mn, 1e-9);
    const y = v => PAD + (mx - v)/range * (H - 2*PAD);
    const x = i => PAD + i/(closes.length - 1) * (W - 2*PAD);
    const fhY = y(fh);
    // Fraktal pozisyonu (barsAgo geriden)
    const barsAgo = r.fractal_bars_ago;
    const fPos = closes.length - 1 - barsAgo;
    // Çizgiyi iki parçaya böl: fraktal kırıldıktan sonrasını yeşil yap
    let breakoutStart = -1;
    for(let i = 0; i < closes.length; i++){
      if(closes[i] > fh){ breakoutStart = i; break; }
    }
    const pathBefore = closes.slice(0, breakoutStart < 0 ? closes.length : breakoutStart+1)
      .map((v,i) => `${i===0?'M':'L'} ${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const pathAfter = breakoutStart >= 0 ?
      closes.slice(breakoutStart).map((v,i) => `${i===0?'M':'L'} ${x(breakoutStart+i).toFixed(1)},${y(v).toFixed(1)}`).join(' ') : '';
    const fMarker = (fPos >= 0 && fPos < closes.length) ?
      `<circle cx="${x(fPos).toFixed(1)}" cy="${fhY.toFixed(1)}" r="2" fill="#f59e0b" stroke="#0a0a0f" stroke-width="0.5"/>` : '';
    return `<svg class="macd-chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`
      + `<line x1="${PAD}" y1="${fhY.toFixed(1)}" x2="${W-PAD}" y2="${fhY.toFixed(1)}" stroke="#f59e0b" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.7"/>`
      + `<path d="${pathBefore}" fill="none" stroke="#8b8b9e" stroke-width="1.3"/>`
      + (pathAfter ? `<path d="${pathAfter}" fill="none" stroke="#22c55e" stroke-width="1.4"/>` : '')
      + fMarker
      + `</svg>`;
  }

  function barCell(v){
    if(v == null) return '';
    const cap = 5;
    const w = Math.min(Math.abs(v), cap) / cap * 50;
    const side = v >= 0 ? 'pos' : 'neg';
    const style = v >= 0 ? `width:${w}%;left:50%;` : `width:${w}%;right:50%;left:auto;`;
    return `<div class="bar-wrap"><div class="bar-mid"></div><div class="bar ${side}" style="${style}"></div></div>`;
  }

  function draw(){
    const list = applyFilter(rows);
    document.getElementById('filter-count').textContent = list.length;
    const tbody = document.getElementById('tbody');
    if(!list.length){
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty">Bu kriterlerde hisse yok</div></td></tr>`;
      return;
    }
    const sorted = [...list].sort((a,b) => {
      const av = getVal(a, sortKey), bv = getVal(b, sortKey);
      if(av == null && bv == null) return 0;
      if(av == null) return 1;
      if(bv == null) return -1;
      if(typeof av === 'string') return sortDir * av.localeCompare(bv);
      return sortDir * ((av || 0) - (bv || 0));
    });

    if(activeTab === 'rel'){
      tbody.innerHTML = sorted.map(r => {
        const rg = r.rel?.gunluk, rh = r.rel?.haftalik, ra = r.rel?.aylik;
        return `<tr>
          <td><div class="sym-cell"><span class="sym-name">${r.sembol}</span></div></td>
          <td class="price">${fmtPrice(r.close)}</td>
          <td class="ret ${cls(rg?.sembol)}">${pct(rg?.sembol)}</td>
          <td class="ret ${cls(rg?.fark)}"><span class="diff-cell">${pct(rg?.fark)}${barCell(rg?.fark)}</span></td>
          <td class="ret ${cls(rh?.sembol)}">${pct(rh?.sembol)}</td>
          <td class="ret ${cls(rh?.fark)}"><span class="diff-cell">${pct(rh?.fark)}${barCell(rh?.fark)}</span></td>
          <td class="ret ${cls(ra?.sembol)}">${pct(ra?.sembol)}</td>
          <td class="ret ${cls(ra?.fark)}"><span class="diff-cell">${pct(ra?.fark)}${barCell(ra?.fark)}</span></td>
          <td>${athCell(r.sembol)}</td>
        </tr>`;
      }).join('');
    } else if(activeMode === 'fractal'){
      tbody.innerHTML = sorted.map(r => {
        const badges = [];
        if(r.fractal_yeni) badges.push('<span class="sym-badge b-new" title="Bu barda kırıldı">🆕 YENİ</span>');
        if(r.sinyal_1) badges.push('<span class="sym-badge b-s1" title="MACD toparlanma sinyali de var">↑ TOP</span>');
        const kirilim_cls = (r.kirilim_pct || 0) >= 0 ? 'pos' : 'neg';
        const sk = fractalScore(r);
        return `<tr>
          <td><div class="sym-cell"><span class="sym-name">${r.sembol}</span>${badges.join('')}</div></td>
          <td>${scoreBadge(sk)}</td>
          <td>${priceFractalChart(r)}</td>
          <td class="price">${fmtPrice(r.close)}</td>
          <td class="dimc">${fmtPrice(r.fractal_high)}</td>
          <td class="ret ${kirilim_cls}">${pct(r.kirilim_pct)}</td>
          <td class="dimc" style="font-size:11px;"><span style="color:#22c55e; font-weight:700;">${breakoutStreak(r)}</span> bar</td>
          <td class="dimc" style="font-size:11px;">${r.fractal_bars_ago || '—'} bar</td>
          <td class="ret ${cls(r.tf_getiri)}">${pct(r.tf_getiri)}</td>
          <td class="ret ${cls(r.tf_fark)}"><span class="diff-cell">${pct(r.tf_fark)}${barCell(r.tf_fark)}</span></td>
          <td>${athCell(r.sembol)}</td>
        </tr>`;
      }).join('');
    } else {
      tbody.innerHTML = sorted.map(r => {
        const streak = r.hist_streak || 0;
        const yon = r.hist_streak_yon || 0;
        const streakDir = yon > 0 ? 'mom-up' : yon < 0 ? 'mom-dn' : '';
        const streakArrow = yon > 0 ? '▲' : yon < 0 ? '▼' : '·';
        const streakText = streak > 0 ? `${streakArrow} ${streak}` : '—';
        const badges = [];
        if(r.sinyal_1) badges.push('<span class="sym-badge b-s1">↑ TOP</span>');
        if(r.sinyal_1 && streak === 1) badges.push('<span class="sym-badge b-new" title="Bu barda ilk kez tetikledi">✨ YENİ</span>');
        const kk = r.koyu_kirmizi_5bar || 0;
        if(kk > 0) badges.push(`<span class="sym-badge b-ihlal" title="Toparlanma başladıktan sonra ${kk} kez dip derinleşti (R- bar) — toparlanma kırılgan">⚠ İHLAL ${kk}</span>`);
        return `<tr>
          <td><div class="sym-cell"><span class="sym-name">${r.sembol}</span>${badges.join('')}</div></td>
          <td>${macdChartCell(r)}</td>
          <td class="price">${fmtPrice(r.close)}</td>
          <td class="ret-big ${cls(r.tf_getiri)}">${pct(r.tf_getiri)}</td>
          <td class="dimc">${pct(r.tf_endeks)}</td>
          <td class="ret ${cls(r.tf_fark)}"><span class="diff-cell">${pct(r.tf_fark)}${barCell(r.tf_fark)}</span></td>
          <td class="${cls(r.ema50_uzaklik)}">${pct(r.ema50_uzaklik,1)}</td>
          <td>${athCell(r.sembol)}</td>
          <td><span class="mom-cell ${streakDir}" title="${streak} bardır ${yon>0?'artıyor':yon<0?'azalıyor':''}">${streakText}</span></td>
        </tr>`;
      }).join('');
    }
    document.querySelectorAll('#thead-row th').forEach(th => th.classList.toggle('active', th.dataset.k===sortKey));
  }

  function renderEndexMacd(){
    const wrap = document.getElementById('endex-macd-wrap');
    const em = DATA?.endex_macd?.[activeTab];
    if(activeTab === 'rel' || activeMode === 'fractal' || !em || !em.hist_series?.length){
      wrap.style.display = 'none';
      return;
    }
    wrap.style.display = '';
    document.getElementById('endex-tf-label').textContent = TABS.find(t => t.key===activeTab)?.label || activeTab;
    document.getElementById('endex-macd-chart').innerHTML = macdChartCell({
      macd_series: em.macd_series, signal_series: em.signal_series, hist_series: em.hist_series
    }, 520, 64);
  }

  function render(){
    rows = currentRows();
    renderHead();
    renderEndexMacd();
    draw();
  }

  document.querySelectorAll('.fgroup[data-g="sig"] .fbtn').forEach(b => b.onclick = () => {
    activeSignal = b.dataset.f;
    document.querySelectorAll('.fgroup[data-g="sig"] .fbtn').forEach(x => x.classList.toggle('active', x.dataset.f === activeSignal));
    draw();
  });
  document.querySelectorAll('.fgroup[data-g="mode"] .fbtn').forEach(b => b.onclick = () => {
    activeMode = b.dataset.m;
    document.querySelectorAll('.fgroup[data-g="mode"] .fbtn').forEach(x => x.classList.toggle('active', x.dataset.m === activeMode));
    // Fraktal moddayken: default siralama skor; MACD moddayken: tf_getiri
    sortKey = activeMode === 'fractal' ? 'skor' : 'tf_getiri';
    sortDir = -1;
    // Sinyal filtresi grubunu fraktal moddayken gizle
    document.querySelector('.fgroup[data-g="sig"]').style.display = activeMode === 'fractal' ? 'none' : '';
    // "Yalniz yeni" butonunun anlami degisir
    const newBtn = document.querySelector('.fbtn[data-g="new"]');
    if(newBtn) newBtn.textContent = activeMode === 'fractal' ? '🆕 Yalnız yeni kırılım' : '✨ Yalnız yeni';
    drawTabs(); render();
  });
  document.querySelector('.fbtn[data-g="new"]').onclick = (e) => {
    newOnly = !newOnly;
    e.currentTarget.classList.toggle('active', newOnly);
    draw();
  };

  document.getElementById('q').addEventListener('input', e => {
    query = e.target.value.trim().toLowerCase();
    draw();
  });

  // ==== Bildirim (Notification API) ====
  const NOTIF_KEY = 'puf_last_new';
  const notifBtn = document.getElementById('notif-btn');

  function updateNotifBtn(){
    if(!('Notification' in window)){
      notifBtn.textContent = '🔕 Desteklenmiyor';
      notifBtn.disabled = true;
      return;
    }
    if(Notification.permission === 'granted') notifBtn.textContent = '🔔 Bildirim açık';
    else if(Notification.permission === 'denied') notifBtn.textContent = '🚫 Bildirim engelli';
    else notifBtn.textContent = '🔕 Bildirim kapalı';
  }
  updateNotifBtn();

  notifBtn.onclick = async () => {
    if(!('Notification' in window)) return;
    if(Notification.permission === 'default'){
      const p = await Notification.requestPermission();
      updateNotifBtn();
      if(p === 'granted'){
        new Notification('Radar bildirimleri açıldı', { body: 'Yeni sinyal geldikçe bilgilendirileceksiniz.', icon: '' });
        // İlk state'i kaydet, spam olmasın
        if(DATA) localStorage.setItem(NOTIF_KEY, JSON.stringify(collectYeni(DATA)));
      }
    } else if(Notification.permission === 'granted'){
      alert('Bildirimler zaten açık. Kapatmak için tarayıcı ayarlarından site izinlerini değiştirin.');
    } else {
      alert('Bildirimler engellenmiş. Adres çubuğundaki kilit simgesinden site izinlerini kontrol edin.');
    }
  };

  function collectYeni(data){
    // {macd::1h: [sym...], fractal::1h: [sym...], ...}
    const out = {};
    const tfs = ['1h','2h','3h','4h','1d','1wk','1mo','3mo'];
    for(const tf of tfs){
      const macd = (data.dilimler?.[tf] || []).filter(r => r.sinyal_1 && r.hist_streak === 1).map(r => r.sembol).sort();
      const frac = (data.dilimler_fractal?.[tf] || []).filter(r => r.fractal_yeni).map(r => r.sembol).sort();
      if(macd.length) out['macd::' + tf] = macd;
      if(frac.length) out['fractal::' + tf] = frac;
    }
    return out;
  }

  function checkAndNotify(data){
    if(!('Notification' in window) || Notification.permission !== 'granted') return;
    const current = collectYeni(data);
    let prev;
    try { prev = JSON.parse(localStorage.getItem(NOTIF_KEY) || '{}'); } catch(e){ prev = {}; }
    const additions = {};
    for(const key of Object.keys(current)){
      const prevSet = new Set(prev[key] || []);
      const yeni = current[key].filter(s => !prevSet.has(s));
      if(yeni.length) additions[key] = yeni;
    }
    localStorage.setItem(NOTIF_KEY, JSON.stringify(current));
    if(!Object.keys(additions).length) return;

    // Metrik erisimi icin index
    const tfs = ['1h','2h','3h','4h','1d','1wk','1mo','3mo'];
    const macdIdx = {}, fracIdx = {};
    for(const tf of tfs){
      macdIdx[tf] = {}; (data.dilimler?.[tf] || []).forEach(r => macdIdx[tf][r.sembol] = r);
      fracIdx[tf] = {}; (data.dilimler_fractal?.[tf] || []).forEach(r => fracIdx[tf][r.sembol] = r);
    }
    const fmt = v => v == null ? '—' : (v >= 0 ? '+' : '') + v.toFixed(2) + '%';

    const macdBlocks = [], fracBlocks = [];
    for(const tf of tfs){
      const macdSyms = additions['macd::' + tf] || [];
      if(macdSyms.length){
        const lines = macdSyms.map(s => {
          const r = macdIdx[tf][s] || {};
          return `  • ${s}  ${fmt(r.tf_getiri)}`;
        }).join('\n');
        macdBlocks.push(`【${tf.toUpperCase()}】 ${macdSyms.length} yeni\n${lines}`);
      }
      const fracSyms = additions['fractal::' + tf] || [];
      if(fracSyms.length){
        const lines = fracSyms.map(s => {
          const r = fracIdx[tf][s] || {};
          const sc = fractalScore(r);
          return `  • ${s}  kırılım ${fmt(r.kirilim_pct)}  · skor ${sc}`;
        }).join('\n');
        fracBlocks.push(`【${tf.toUpperCase()}】 ${fracSyms.length} yeni\n${lines}`);
      }
    }

    const total = Object.values(additions).reduce((a,v) => a + v.length, 0);
    const now = new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
    const bodyParts = [];
    if(macdBlocks.length) bodyParts.push('📊 MACD TOPARLANMA\n' + macdBlocks.join('\n'));
    if(fracBlocks.length) bodyParts.push('🔓 FRAKTAL KIRILIM\n' + fracBlocks.join('\n'));
    const body = bodyParts.join('\n\n');

    const n = new Notification(`🆕 ${total} yeni sinyal · ${now}`, {
      body,
      tag: 'radar-new',
      renotify: true,
      requireInteraction: total >= 5   // 5+ olunca kalici kalsin (kullanici kapatana kadar)
    });
    n.onclick = () => { window.focus(); n.close(); };
  }

  async function load(){
    try {
      const res = await fetch('./puf.json?t=' + Date.now());
      const newData = await res.json();
      const isFirstLoad = !DATA;
      DATA = newData;
      document.getElementById('upd-label').textContent = 'Canlı · ' + new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
      document.getElementById('upd-intraday').textContent = (DATA.hourly_guncelleme || '—').slice(-5);
      document.getElementById('upd-daily').textContent = (DATA.daily_guncelleme || '—').slice(-5);
      drawTabs();
      render();
      // Ilk yuklemede state'i kur, sonrakilerinde diff kontrol
      if(isFirstLoad){
        if(!localStorage.getItem(NOTIF_KEY)) localStorage.setItem(NOTIF_KEY, JSON.stringify(collectYeni(DATA)));
      } else {
        checkAndNotify(DATA);
      }
    } catch(e){
      document.getElementById('upd-label').textContent = 'Hata';
      document.getElementById('tbody').innerHTML = `<tr><td colspan="9"><div class="empty">Veri yüklenemedi: ${e.message}</div></td></tr>`;
    }
  }
  load();
  setInterval(load, 60000);
</script>
